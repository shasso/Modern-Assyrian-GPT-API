services:
  syriac-gpt-api:
    build: .
    image: syriac-gpt-api:latest
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - PYTHONUNBUFFERED=1
    # Simpler GPU request; requires Docker with NVIDIA runtime / toolkit installed
    gpus: all
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped